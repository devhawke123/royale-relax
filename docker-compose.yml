services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres
      POSTGRES_DB: royale_relax
    ports:
      - "5432:5432"
    volumes:
      - royale_relax_pgdata:/var/lib/postgresql/data

volumes:
  royale_relax_pgdata:
